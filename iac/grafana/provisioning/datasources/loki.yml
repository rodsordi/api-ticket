apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "(?:trace_id|traceId)=([a-f0-9]+)"
          url: "$${__value.raw}"
          datasourceUid: jaeger
