apiVersion: v1
kind: Service
metadata:
  name: api-ticket
  namespace: {{ .Release.Namespace | default "ticket" }}
  labels:
    app: api-ticket
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: api-ticket
