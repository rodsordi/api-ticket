apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-ticket.fullname" . | default "api-ticket" }}
  namespace: {{ .Release.Namespace | default "ticket" }}
  labels:
    app: api-ticket
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-ticket
  template:
    metadata:
      labels:
        app: api-ticket
    spec:
      containers:
        - name: api-ticket
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: SPRING_CASSANDRA_CONTACT_POINTS
              value: "cassandra"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak:8080/realms/ticket"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://keycloak:8080/realms/ticket/protocol/openid-connect/certs"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
