# ===================================================================
# Application Base & Info (Integration Test Profile)
# ===================================================================

# ===================================================================
# AWS S3 / LocalStack
# ===================================================================
# Dynamically injected by FlociSetup Testcontainer at runtime:
# spring.cloud.aws.s3.endpoint
# spring.cloud.aws.region.static
# spring.cloud.aws.credentials.access-key
# spring.cloud.aws.credentials.secret-key

# ===================================================================
# Cassandra Database
# ===================================================================
# Dynamically injected by CassandraSetup Testcontainer at runtime:
# spring.cassandra.contact-points
# spring.cassandra.port
spring.cassandra.keyspace-name=ticket
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=none

# ===================================================================
# Flyway Database Migration
# ===================================================================
# Dynamically injected by CassandraSetup Testcontainer at runtime:
# spring.flyway.url
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Redis Cache
# ===================================================================
# Dynamically injected by RedisSetup Testcontainer at runtime:
# spring.data.redis.host
# spring.data.redis.port

# ===================================================================
# Apache Kafka
# ===================================================================
# Dynamically injected by KafkaSetup Testcontainer at runtime:
# spring.kafka.bootstrap-servers
spring.kafka.consumer.group-id=api-ticket-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.support.serializer.json.trusted.packages=*

# ===================================================================
# Email Notifications
# ===================================================================
email.ticket-management-email-recipient=management@ticket.com
email.estimate-customer-approval-email-subject=Estimate Approval Request
email.body-template-file-name=/estimate-customer-approval-email-message.html

# ===================================================================
# Security & OAuth2 / Keycloak
# ===================================================================
# Dynamically injected by KeycloakSetup Testcontainer at runtime:
# spring.security.oauth2.resourceserver.jwt.issuer-uri
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri

# ===================================================================
# Logging
# ===================================================================
logging.level.br.com.cielo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.validation=DEBUG

# ===================================================================
# Topics & Messaging
# ===================================================================
message.notification-creation.topic=api-ticket_notification-creation_topic

# ===================================================================
# Web Configuration
# ===================================================================
web.ticket-web-page-url=http://localhost:8080/ticket

# ===================================================================
# Tracing & Observability (OpenTelemetry - Disabled for Integration Tests)
# ===================================================================
management.tracing.enabled=false
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.tracing.transport=http
management.otlp.metrics.export.enabled=false
otel.sdk.disabled=true