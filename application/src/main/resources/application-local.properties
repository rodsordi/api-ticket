# AWS
spring.cloud.aws.region.static=sa-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test

# AWS_SQS
spring.cloud.aws.sqs.enabled=true
spring.cloud.aws.sqs.endpoint=http://localhost:4566
spring.cloud.aws.sqs.account=000000000000
spring.cloud.aws.sqs.queue-not-found-strategy=CREATE

# DB
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.sql.init.mode=always

# Email
email.ticket-management-email-recipient=management@ticket.com
email.estimate-customer-approval-email-subject=Estimate Approval Request
email.body-template-file-name=/estimate-customer-approval-email-message.html

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.createSchemas=true
spring.flyway.locations=classpath:/db/migrations
spring.flyway.schemas=ticket

# JPA
spring.jpa.show-sql=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.default_schema=ticket
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.flushMode=commit
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.order_inserts= true
spring.jpa.properties.hibernate.order_updates= true

# JWT
jwt.secret=thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sbbdd
jwt.expiration=3600000

# LOG
logging.level.br.com.cielo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.validation=DEBUG

# Message
message.notification-creation.topic=api-ticket_notification-creation_topic
message.notification-creation.queue=api-ticket_notification-creation_queue

# Web
web.ticket-web-page-url=http://localhost:8080/ticket

# Trancing
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.tracing.export.otlp.transport=http

# Metrics
management.otlp.metrics.export.url=http://localhost:9090/api/v1/otlp/v1/metrics

# Logs
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:3100/otlp/v1/logs