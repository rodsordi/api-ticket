# AWS S3 / LocalStack
spring.cloud.aws.region.static=sa-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.s3.endpoint=http://localhost:4566

# Cassandra
spring.cassandra.keyspace-name=ticket
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=none

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:cassandra://localhost:9042/ticket

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=api-ticket-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.support.serializer.json.trusted.packages=*

# Email
email.ticket-management-email-recipient=management@ticket.com
email.estimate-customer-approval-email-subject=Estimate Approval Request
email.body-template-file-name=/estimate-customer-approval-email-message.html

# OAuth2 / Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/ticket

# LOG
logging.level.br.com.cielo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.validation=DEBUG

# Message
message.notification-creation.topic=api-ticket_notification-creation_topic

# Web
web.ticket-web-page-url=http://localhost:8080/ticket

# Tracing
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.tracing.export.otlp.transport=http

# Metrics
management.otlp.metrics.export.url=http://localhost:9090/api/v1/otlp/v1/metrics

# Logs
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:3100/otlp/v1/logs