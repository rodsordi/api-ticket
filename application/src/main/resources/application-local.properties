# ===================================================================
# Application Base & Info
# ===================================================================
# server.servlet.context-path=/api (inherited from application.properties)
# spring.application.name (inherited from application.properties)

# ===================================================================
# AWS S3 / LocalStack
# ===================================================================
# Note: Production credentials are provided via AWS IAM Roles / Secrets Manager
spring.cloud.aws.region.static=sa-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.s3.endpoint=http://localhost:4566

# ===================================================================
# Cassandra Database
# ===================================================================
spring.cassandra.keyspace-name=ticket
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=none

# ===================================================================
# Flyway Database Migration
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:cassandra://localhost:9042/ticket

# ===================================================================
# Redis Cache
# ===================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===================================================================
# Apache Kafka
# ===================================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=api-ticket-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.support.serializer.json.trusted.packages=*

# ===================================================================
# Email Notifications
# ===================================================================
email.ticket-management-email-recipient=management@ticket.com
email.estimate-customer-approval-email-subject=Estimate Approval Request
email.body-template-file-name=/estimate-customer-approval-email-message.html

# ===================================================================
# Security & OAuth2 / Keycloak
# ===================================================================
# Note: Production issuer/JWKS URLs are provided via Vault / K8s Secrets
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/ticket
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/ticket/protocol/openid-connect/certs

# ===================================================================
# Logging
# ===================================================================
logging.level.br.com.cielo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.validation=DEBUG

# ===================================================================
# Topics & Messaging
# ===================================================================
message.notification-creation.topic=api-ticket_notification-creation_topic

# ===================================================================
# Web Configuration
# ===================================================================
web.ticket-web-page-url=http://localhost:8080/ticket

# ===================================================================
# Tracing & Observability (OpenTelemetry)
# ===================================================================
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.tracing.export.otlp.transport=http
management.otlp.metrics.export.url=http://localhost:9090/api/v1/otlp/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:3100/otlp/v1/logs