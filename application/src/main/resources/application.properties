# Application
server.servlet.context-path=/api
spring.application.name=@project.parent.artifactId@

# Actuator
info.app.title=@project.parent.name@
info.app.name=@project.parent.artifactId@
info.app.version=@project.parent.version@
info.app.description=@project.parent.description@
management.info.env.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.prometheus.metrics.export.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true

# OpenTelemetry & Observability
management.tracing.enabled=true
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.resource-attributes.service.name=${spring.application.name:api-ticket}
management.opentelemetry.resource-attributes.service.version=${info.app.version:0.0.1-SNAPSHOT}
management.opentelemetry.resource-attributes.deployment.environment=${SPRING_PROFILES_ACTIVE:local}

# Traces Export (Spring Boot 3.x & 4.x compatible)
management.otlp.tracing.export.enabled=true
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://jaeger:4318/v1/traces}
management.otlp.tracing.transport=${OTEL_EXPORTER_OTLP_TRACES_TRANSPORT:http}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://jaeger:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=${OTEL_EXPORTER_OTLP_TRACES_TRANSPORT:http}

# Logs Export
management.otlp.logging.export.enabled=true
management.otlp.logging.export.url=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://loki:3100/otlp/v1/logs}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://loki:3100/otlp/v1/logs}

# Web
spring.mvc.problemdetails.enabled=true
spring.jackson.mapper.sort_properties_alphabetically=false

# Reservation Expiration Delay Config (in minutes)
reservation.expiration-delay-minutes=15

# Security
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/ticket/protocol/openid-connect/certs}

# Logging
logging.level.org.springframework.security=TRACE