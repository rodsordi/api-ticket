# Cassandra
spring.cassandra.keyspace-name=ticket
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=create_if_not_exists

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=api-ticket-group
spring.kafka.consumer.auto-offset-reset=earliest

# Email
email.ticket-management-email-recipient=management@ticket.com
email.estimate-customer-approval-email-subject=Estimate Approval Request
email.body-template-file-name=/estimate-customer-approval-email-message.html

# JWT
jwt.secret=thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sbbdd
jwt.expiration=3600000

# LOG
logging.level.br.com.cielo=DEBUG

# Message
message.notification-creation.topic=api-ticket_notification-creation_topic

# Web
web.ticket-web-page-url=http://localhost:8080/ticket

# Tracing
management.tracing.enabled=false
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.tracing.transport=http
management.otlp.metrics.export.enabled=false

otel.sdk.disabled=false