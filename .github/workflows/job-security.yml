name: Security Audit

on:
  workflow_call:
    secrets:
      NVD_API_KEY:
        required: false

jobs:
  owasp-report:
    runs-on: [self-hosted, local, ticket]

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Cache OWASP Data
        uses: actions/cache@v4
        with:
          path: /root/.owasp/dependency-check/data
          key: owasp-data-${{ runner.os }}
          restore-keys: |
            owasp-data-${{ runner.os }}

      - name: Generate OWASP Dependency-Check report
        run: mvn -B clean verify -DskipTests -Dowasp -DautoUpdate=false -DdataDirectory=/root/.owasp/dependency-check/data || true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 1
